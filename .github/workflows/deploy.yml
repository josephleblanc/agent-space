# Track G7 — release build in CI; InsForge hosts via source deploy + Vercel remote build.
# Deploy is skipped when INSFORGE_API_KEY is not configured (no secret required for CI green).
#
# WASM (~29 MB) exceeds InsForge OSS per-file upload limit (413), so we cannot upload a
# pre-built .deploy-dist bundle. CI still runs trunk build --release for verification;
# `deployments deploy .` uploads source and runs scripts/vercel-build.sh on Vercel.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Trunk
        run: cargo install --locked trunk --version 0.21.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Write build-time env (VITE_*)
        working-directory: web
        env:
          VITE_INSFORGE_URL: ${{ secrets.VITE_INSFORGE_URL }}
          VITE_VAPI_PUBLIC_KEY: ${{ secrets.VITE_VAPI_PUBLIC_KEY }}
        run: npm run build

      - name: Trunk release build
        working-directory: web
        run: |
          unset NO_COLOR
          trunk build --release

      - name: Stage local preview bundle
        run: bash scripts/prepare-deploy-bundle.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/
            .deploy-dist/
          retention-days: 7

      - name: Deploy to InsForge (skipped without INSFORGE_API_KEY)
        env:
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
        run: |
          if [ -z "$INSFORGE_API_KEY" ]; then
            echo "INSFORGE_API_KEY secret not set — artifacts uploaded; deploy skipped."
            exit 0
          fi
          npx --yes @insforge/cli@latest deployments deploy .

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Space</title>
    <script>
      // Register before Trunk's head WASM bootstrap so we do not miss the event.
      window.hideAgentSpaceSplash = function hideAgentSpaceSplash() {
        const splash = document.getElementById("splash");
        if (splash && !splash.classList.contains("hidden")) {
          splash.classList.add("hidden");
        }
      };
      window.addEventListener("TrunkApplicationStarted", () => {
        window.hideAgentSpaceSplash?.();
        if (window.wasmBindings?.on_room_state_sync) {
          import("/js/game-bridge.js")
            .then(({ exposeWasmExports }) => exposeWasmExports(window.wasmBindings))
            .catch((error) =>
              console.warn("[index] early WASM bridge bind failed:", error),
            );
        }
      });
    </script>
    <link data-trunk rel="css" href="css/style.css" />
    <!-- Copy JS bridges (web/js/) and glTF/props (repo-root assets/) into dist/.
         copy-dir keeps the source dir name, yielding dist/js/ and dist/assets/.
         Paths are resolved relative to this file's dir (web/). -->
    <link data-trunk rel="copy-dir" href="js" />
    <link data-trunk rel="copy-dir" href="../assets" />
    <link
      data-trunk
      rel="rust"
      data-bin="game"
      href="../crates/game/Cargo.toml"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <div id="app">
      <div id="splash" aria-live="polite">
        <div class="splash-content">
          <h1>Agent Space</h1>
          <p>Loading hangout room…</p>
          <div class="spinner" role="status" aria-label="Loading"></div>
        </div>
      </div>

      <main id="game-shell">
        <div id="viewport-frame">
          <canvas id="bevy-canvas"></canvas>
        </div>

        <aside id="agent-roster" aria-label="Agent roster">
          <header class="roster-header">
            <h2>Agents</h2>
            <button
              id="roster-toggle"
              type="button"
              class="icon-button"
              aria-expanded="true"
              aria-controls="agent-roster-list"
              title="Toggle roster"
            >
              ‹
            </button>
          </header>
          <p id="agent-roster-empty" hidden>No agents in room.</p>
          <ul id="agent-roster-list"></ul>
          <footer class="roster-footer">
            <span class="roster-stat-label">Active tasks</span>
            <span id="task-count" class="roster-stat-value">0</span>
          </footer>
        </aside>
      </main>

      <footer id="controls">
        <button
          id="mic-button"
          type="button"
          class="mic-button"
          aria-label="Start voice call"
          aria-pressed="false"
          title="Start Vapi voice session"
        >
          <span class="mic-icon" aria-hidden="true"></span>
          <span class="mic-label">Start voice</span>
        </button>
      </footer>

      <aside id="dev-panel" class="dev-panel" hidden aria-label="Developer tools">
        <header class="dev-panel-header">
          <h2>Dev Inject</h2>
          <button id="dev-toggle-inject" type="button" class="dev-button">
            Toggle inject mode
          </button>
        </header>
        <p class="dev-hint">
          Alt+D toggles this panel. With inject mode on: press <kbd>1</kbd> idle,
          <kbd>2</kbd> walking, <kbd>3</kbd> working, <kbd>4</kbd> mixed.
        </p>
        <p class="dev-url">
          <span>room-state:</span>
          <code id="dev-room-state-url"></code>
        </p>
        <div class="dev-actions">
          <button type="button" class="dev-button" data-mock-preset="idle">Idle</button>
          <button type="button" class="dev-button" data-mock-preset="walking">Walking</button>
          <button type="button" class="dev-button" data-mock-preset="working">Working</button>
          <button type="button" class="dev-button" data-mock-preset="mixed">Mixed</button>
          <button id="dev-fetch-live" type="button" class="dev-button dev-button-secondary">
            Fetch live
          </button>
        </div>
      </aside>
    </div>

    <script>
      // AudioContext resume shim: browsers block audio until a user gesture.
      // The mic button (Track D vapi-bridge) will also call this before Vapi / Bevy audio.
      let audioCtx = null;

      function resumeAudioContext() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        if (!audioCtx) {
          audioCtx = new AudioCtx();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }

      function bindAudioResume() {
        document.addEventListener("click", resumeAudioContext, { once: true });
        document.addEventListener("keydown", resumeAudioContext, { once: true });
      }

      bindAudioResume();
      window.resumeAudioContext = resumeAudioContext;

      window.addEventListener("load", () => {
        if (window.wasmBindings) {
          window.hideAgentSpaceSplash?.();
        }
        window.setTimeout(() => window.hideAgentSpaceSplash?.(), 8000);
      });
    </script>
    <script src="js/env.js"></script>
    <script type="module" src="js/app.js?v=3"></script>
  </body>
</html>
